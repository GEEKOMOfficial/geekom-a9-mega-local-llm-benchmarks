<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">A9 Mega 395 decode rate by input context length</title>
  <desc id="description">Single-device Qwen3.8-Flash-Next UD-Q4_K_XL with Strata memory-resident experts and MTP N=4. Decode rates in tokens per second: 37.7 at 128 input tokens, 42.4 at 4K, 38.3 at 8K, 35.8 at 16K, 35.1 at 32K, 31.9 at 64K, and 33.2 at 128K.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #14253d; }
