  <text class="value" x="300" y="228" text-anchor="middle">28.48</text>
  <text class="value" x="432" y="247" text-anchor="middle">25.88</text>
  <text class="value" x="564" y="264" text-anchor="middle">23.58</text>
  <text class="value" x="696" y="305" text-anchor="middle">18.06</text>
  <text class="value" x="828" y="324" text-anchor="middle">15.45</text>
  <g class="tick" text-anchor="middle">
    <text x="168" y="489">128</text>
    <text x="300" y="489">8K</text>
    <text x="432" y="489">16K</text>
    <text x="564" y="489">32K</text>
