<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">A9 Mega 388 decode rate by input context length</title>
  <desc id="description">Single-device Qwen3.6-35B-A3B UD-Q4_K_M with MTP N=2. Decode rates in tokens per second: 68.03 at 128 input tokens, 67.76 at 8K, 63.55 at 16K, 54.30 at 32K, 50.30 at 64K, 32.61 at 128K, and 21.66 at 256K.</desc>
