<title id="title">Qwen3.8-Flash-Next quantization fidelity versus GGUF file size</title>
<desc id="desc">Top-1 recovery rises from 77.325 percent at 72.5 GB to 94.122 percent at 188.2 GB. Mean KLD falls from 0.396070 to 0.026574. The UD-Q4_K_XL point is 111.3 GB, 92.255 percent Top-1 recovery, and 0.046893 KLD. Full values are in the adjacent README table.</desc>
